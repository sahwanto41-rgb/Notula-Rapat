<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notula Digital SDN Lanas 1</title>
<meta name="theme-color" content="#0F1A55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif;
--bg:#EFF3FC;--card:#fff;--ink:#0E1838;--mut:#566282;--line:#DCE4F5;--ruled:#CCD9F4;
--pri:#1B2F8A;--pri-h:#2540B5;--gold:#FFC83D;--red:#E5384F;--side:#0F1A55;
--ok:#0C7A55;--warn:#9A5B07;--bad:#BE2037;--bad-bg:#FDE6EA;--warn-bg:#FFEFC2;
--slip:#FFF4C9;--slip-b:#F1DC85;--glow:rgba(37,64,181,.2);--ring:#2540B5;
--td-b:#E5E9F6;--td-c:#46507A;--ta-b:#FFEFC2;--ta-c:#845000;--tk-b:#D6F2E6;--tk-c:#0A6948;--tr-b:#E3E0F8;--tr-c:#4A3DA6;
--sh:0 14px 30px -14px rgba(15,26,85,.4);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0F2C;--card:#131A44;--ink:#E8ECFB;--mut:#9AA6CB;--line:#27316B;--ruled:#222C62;--pri:#4C63E6;--pri-h:#6075F0;--side:#070B22;--ok:#4FD39F;--warn:#F2B650;--bad:#FF8597;--bad-bg:rgba(255,133,151,.16);--warn-bg:rgba(242,182,80,.16);--slip:#342F17;--slip-b:#5C5326;--glow:rgba(120,140,255,.3);--ring:#FFC83D;--td-b:#222B5E;--td-c:#B9C3EA;--ta-b:#4A3A12;--ta-c:#FFD27A;--tk-b:#12402F;--tk-c:#7BE3B8;--tr-b:#2E2A66;--tr-c:#C5BCFF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A0F2C;--card:#131A44;--ink:#E8ECFB;--mut:#9AA6CB;--line:#27316B;--ruled:#222C62;--pri:#4C63E6;--pri-h:#6075F0;--side:#070B22;--ok:#4FD39F;--warn:#F2B650;--bad:#FF8597;--bad-bg:rgba(255,133,151,.16);--warn-bg:rgba(242,182,80,.16);--slip:#342F17;--slip-b:#5C5326;--glow:rgba(120,140,255,.3);--ring:#FFC83D;--td-b:#222B5E;--td-c:#B9C3EA;--ta-b:#4A3A12;--ta-c:#FFD27A;--tk-b:#12402F;--tk-c:#7BE3B8;--tr-b:#2E2A66;--tr-c:#C5BCFF;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);margin:0 0 .5rem;letter-spacing:-.015em;line-height:1.2}
h2{font-size:22px}h3{font-size:18px;font-weight:700}
p{margin:.5em 0}
.mu{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-64px;background:var(--gold);color:#241B00;padding:8px 14px;border-radius:10px;z-index:99;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

/* kerangka: sidebar + konten */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:24px 16px 18px;background:var(--side);color:#fff;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.brand>div{min-width:0}
.brand svg{flex:0 0 auto;width:44px;height:44px}
.brand b{display:block;font:700 20px/1.1 var(--fd);letter-spacing:-.02em}
.brand small{display:block;margin-top:3px;font-size:12px;line-height:1.3;color:#AEBBEA}
#nav{display:flex;flex-direction:column;gap:2px;flex:1}
#nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:none;color:#B9C4F2;font:500 15px/1.2 var(--fb);text-align:left;cursor:pointer;white-space:nowrap}
#nav button svg{flex:0 0 auto;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button:hover{background:rgba(255,255,255,.08);color:#fff}
#nav button.on{background:#fff;color:#0F1A55;font-weight:700;box-shadow:inset 4px 0 0 var(--red)}
#nav button:focus-visible,.who :focus-visible{outline-color:var(--gold)}
.who{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:end;padding:12px;border-radius:14px;background:rgba(255,255,255,.07)}
.who label{grid-column:1/-1;margin:0;font-size:12px;font-weight:600;color:#AEBBEA}
.who select{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.2);padding:9px 10px;min-height:42px}
.who select option{color:#111;background:#fff}
.ib{width:42px;height:42px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.18)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.main{min-width:0;max-width:1180px;width:100%;margin:0 auto;padding:30px clamp(16px,4vw,44px) 48px}

/* judul halaman */
.pg{margin:2px 0 22px}
.pg h1{font:700 clamp(28px,4.4vw,38px)/1.1 var(--fd);letter-spacing:-.025em;margin:0 0 6px}
.pg p{margin:0;color:var(--mut);max-width:62ch}

/* kartu */
.c{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.c>h3:first-child{margin-bottom:.35rem}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g.st{gap:0;grid-template-columns:repeat(4,1fr);background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;margin:0 0 16px}
.g.st .c{background:none;border:0;border-radius:0;margin:0;padding:18px 20px;border-left:1.5px solid var(--line);color:var(--mut);font-size:13.5px;line-height:1.4}
.g.st .c:first-child{border-left:0}
.n{font:700 40px/1 var(--fd);letter-spacing:-.03em;color:var(--ink);margin-bottom:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.two .c{margin-bottom:0}
.tip{border-left:5px solid var(--gold);background:var(--slip);padding:12px 16px;border-radius:4px 12px 12px 4px;margin:0 0 16px;color:var(--ink)}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font:700 19px var(--fd);margin-bottom:6px}
.empty .b{margin-top:14px}
.cnt{color:var(--mut);font-size:13px;margin:0 0 10px}

/* hero: halaman buku tulis */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 28px;align-items:start;margin-bottom:16px;padding:32px 32px 28px 96px;border:1.5px solid var(--line);border-radius:24px;background-color:var(--card);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--ruled) 31px,var(--ruled) 32px);overflow:hidden}
.hero::before{content:"";position:absolute;left:66px;top:0;bottom:0;width:2px;background:var(--red)}
.hero p{margin:0;line-height:32px}
.hero .hd{color:var(--mut)}
.hero h1{margin:0;font:700 clamp(26px,4vw,40px)/64px var(--fd);letter-spacing:-.025em}
.hero .ha{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hero .b.o{background:var(--card)}
.cal{position:relative;width:112px;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--sh);transform:rotate(3deg);animation:drop .55s cubic-bezier(.2,.9,.3,1.2) both}
.cal::after{content:"";position:absolute;top:-9px;left:50%;width:46px;height:17px;margin-left:-23px;background:rgba(255,200,61,.85);transform:rotate(-4deg)}
.cal i{display:block;background:var(--red);color:#fff;font:700 14px/1 var(--fb);font-style:normal;padding:10px 0 7px;border-radius:12px 12px 0 0}
.cal b{display:block;font:800 56px/1 var(--fd);letter-spacing:-.04em;padding-top:8px}
.cal span{display:block;color:var(--mut);font-size:13px;font-weight:600;padding:2px 0 12px}
@keyframes drop{from{opacity:0;transform:translateY(-18px) rotate(-6deg)}to{opacity:1;transform:rotate(3deg)}}

/* grafik batang */
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-items:end;height:160px;margin-top:10px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--mut);text-align:center}
.bars span{font-weight:700;color:var(--ink)}
.bars i{display:block;width:100%;max-width:36px;background:var(--pri);border-radius:7px 7px 3px 3px}
.bars .z i{background:var(--ruled)}
.bars .now{color:var(--ink);font-weight:700}
.bars .now i{background:var(--red)}

/* daftar: chip tanggal + kartu rapat */
.it{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .tag{margin-left:auto;flex:0 0 auto}
.dt{flex:0 0 64px;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:7px 0 6px;line-height:1.15;background:var(--bg)}
.dt b{display:block;font:700 22px var(--fd)}
.dt span{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.mb{min-width:0}
.mb b{display:block}
.mb small,.mty{display:block;color:var(--mut);font-size:13.5px}
.mb small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;margin-bottom:12px}
.mh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mh b{font:700 16px var(--fd);display:inline}
.mty{color:var(--ink);font-size:14.5px;margin-top:2px}
.ma{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}

/* formulir */
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input,select,textarea{width:100%;padding:10px 12px;min-height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--glow)}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:0 14px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}
.filt{padding:14px}.filt .row{gap:10px}
.filt label{margin:0}
.slip{background:var(--slip);border-color:var(--slip-b)}
.slip textarea{background:rgba(255,255,255,.65);border-color:var(--slip-b)}
:root[data-theme="dark"] .slip textarea{background:rgba(0,0,0,.25)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .slip textarea{background:rgba(0,0,0,.25)}}
.slip .b{margin-top:10px}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.savebar select{width:auto;min-width:170px}
#bk{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:120px}

/* tombol */
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;margin:2px;padding:10px 16px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:600 14px/1.2 var(--fb);cursor:pointer}
.b:hover{background:var(--pri-h)}
.b:active{transform:translateY(1px)}
.b.g2{background:var(--gold);color:#241B00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.b.g2:hover{background:#FFD25E}
.b.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.b.o:hover{background:var(--bg);border-color:var(--mut)}
.b.r{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.b.r:hover{background:var(--bad-bg)}
.b.x{min-height:38px;width:38px;padding:0;background:transparent;color:var(--bad);border:1.5px solid transparent;font-size:20px}
.b.x:hover{background:var(--bad-bg)}
button:disabled{opacity:.45;cursor:not-allowed}

/* tabel */
.tw{overflow-x:auto}
#app table{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
#app th{padding:10px 12px;text-align:left;font:600 12.5px/1.3 var(--fb);color:var(--mut);border-bottom:2px solid var(--ruled);white-space:nowrap}
#app td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
#app tr:last-child td{border-bottom:0}
#app td input,#app td select{padding:8px 10px;min-height:38px;background:var(--bg);border-color:transparent}
#app td input:focus,#app td select:focus{background:var(--card);border-color:var(--pri)}
#app table.rk{min-width:0}
.rk td{padding:9px 10px}
.rk .bw{width:42%}
.rk .bw i{display:block;height:10px;border-radius:99px;background:var(--pri)}
.rk .num{width:48px;text-align:right;font-weight:700}
.tw+.b{margin-top:12px}

/* status */
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;background:var(--td-b);color:var(--td-c);font:600 12px/1.5 var(--fb)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-draf{background:var(--td-b);color:var(--td-c)}
.t-ajuan{background:var(--ta-b);color:var(--ta-c)}
.t-ok{background:var(--tk-b);color:var(--tk-c)}
.t-arsip{background:var(--tr-b);color:var(--tr-c)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.flag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700}
.flag.bad{background:var(--bad-bg);color:var(--bad)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}

/* notifikasi */
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-24px);opacity:0;pointer-events:none;max-width:min(560px,calc(100% - 28px));padding:12px 18px;border-radius:14px;border-left:6px solid var(--gold);background:var(--ink);color:var(--bg);font-weight:500;box-shadow:var(--sh);z-index:99;cursor:pointer;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast.ok{border-left-color:#3DDC97}

/* pratinjau dokumen */
#doc{display:none}
.ov{position:fixed;inset:0;background:rgba(9,14,40,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto;padding:16px;z-index:50}
.ov .bar{position:sticky;top:0;z-index:2;padding:4px 0}
.ov .bar .b.o{background:var(--card);color:var(--ink)}
.ov details{color:#fff}
.paper{background:#fff;color:#000;font:12pt/1.5 'Times New Roman',serif;padding:20mm;max-width:210mm;margin:auto;border-radius:4px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6)}
.paper h2{text-align:center;font:700 12pt 'Times New Roman',serif;margin:0;letter-spacing:0}
.paper .kop{text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:12px}
.paper table{border-collapse:collapse;width:100%}
.paper td,.paper th{border:0;padding:1px 4px;text-align:left;vertical-align:top}
.paper .bt td,.paper .bt th{border:1px solid #000}
.paper .bt th{background:#ECEFF5}
.paper .sig{display:flex;justify-content:space-between;margin-top:30px;text-align:center}
.paper pre{white-space:pre-wrap;font:inherit;margin:2px 0}
.paper.hist{margin-top:8px;font:13px/1.5 var(--fb);color:#222}

/* layar kecil */
@media(max-width:880px){
.shell{display:block}
.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 14px 0;overflow:visible}
.brand{order:1;flex:1 1 0;min-width:0}
.brand svg{width:36px;height:36px}
.brand b{font-size:17px}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{order:2;display:flex;align-items:center;padding:0;background:none}
.who label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.who select{width:auto;min-height:38px;padding:6px 8px;font-size:13px}
.ib{width:38px;height:38px}
#nav{order:3;flex:0 0 100%;flex-direction:row;gap:4px;margin:0 -14px;padding:6px 14px 10px;overflow-x:auto;position:relative;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{width:auto;padding:9px 14px;border-radius:99px;gap:8px;font-size:14px}
#nav button svg{width:18px;height:18px}
#nav button.on{box-shadow:none}
.main{padding:20px 16px 40px}
.paper{padding:16px;font-size:11pt}
}
@media(max-width:720px){
.g.st{grid-template-columns:1fr 1fr}
.g.st .c:nth-child(3){border-left:0}
.g.st .c:nth-child(n+3){border-top:1.5px solid var(--line)}
.n{font-size:34px}
.hero{padding:20px 14px 20px 54px;gap:8px 12px}
.hero::before{left:36px}
.hero h1{font-size:24px;line-height:32px}
.cal{width:78px}
.cal b{font-size:38px}
.cal i{font-size:12px;padding:8px 0 5px}
.cal span{font-size:12px;padding-bottom:8px}
.bars{gap:4px;height:140px}
.mt{grid-template-columns:52px minmax(0,1fr);gap:12px;padding:14px}
.dt{flex-basis:52px}
.ma{grid-column:1/-1;justify-content:flex-start}
.row>*{min-width:100%}
.filt .row>*{min-width:0;flex:1 1 100%}
.filt .row>input[aria-label="Tahun"]{flex:1 1 90px;max-width:none!important}
.filt .row>select[aria-label="Filter bulan"]{flex:1 1 140px}
.savebar{flex-direction:column;align-items:stretch}
.savebar select{width:100%}
.savebar>div:last-child{display:flex;gap:6px}
.savebar>div:last-child .b{flex:1}
/* tabel jadi kartu */
#app table.stack{min-width:0;display:block}
#app .stack tbody{display:block}
#app .stack tr{display:block;padding:10px 12px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
#app .stack tr.hr{display:none}
#app .stack td{display:grid;grid-template-columns:104px minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;border:0}
#app .stack td::before{content:attr(data-l);color:var(--mut);font-size:12px;font-weight:600}
#app .stack td.rm{display:flex;justify-content:flex-end}
#app .stack td.rm::before{content:none}
#app .stack td[colspan]{display:block}
#app .stack td[colspan]::before{content:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{body>*:not(#doc){display:none!important}#doc{display:block!important}.ov{position:static;background:none;padding:0;overflow:visible;-webkit-backdrop-filter:none;backdrop-filter:none}.bar,.hist{display:none!important}.paper{padding:0!important;max-width:none;margin:0!important;box-shadow:none;border-radius:0}@page{size:A4;margin:20mm}}

.ksl{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ksl:empty{display:none}
.kb{display:flex;gap:12px;align-items:baseline;width:100%;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.kb:hover{background:var(--bg);border-color:var(--pri)}
.kb b{flex:0 0 auto;min-width:64px;font-variant-numeric:tabular-nums}
.kb span{color:var(--mut);font-size:13.5px}
.row small{display:block;margin-top:6px}
</style></head><body>
<a class="skip" href="#app">Lewati ke konten</a>

var n=rd('an'),ni=rd('ai'),j=rd('aj'),s=rd('as'),c=rd('ac'),att=n.map(function(_,i){return{n:n[i],nip:ni[i],j:j[i],st:s[i],c:c[i]}}).filter(function(a){return a.n}),
a=rd('ta'),pp=rd('tp'),d=rd('td'),ts=rd('ts'),e=rd('te'),tl=a.map(function(_,i){return{act:a[i],pic:pp[i],due:d[i],st:ts[i],ev:e[i]}}).filter(function(t){return t.act});
var o=id?D.m.filter(function(x){return x.id==id})[0]:null,m=o||{id:Date.now(),hist:[]};
['no','kode','urut','sur','type','date','start','end','place','lead','note','nnip','agenda','disc','dec','ex','status'].forEach(function(k){m[k]=g(k)});

if(p)pv(m.id);else{toast('Notulen tersimpan.'+(sp?' Nomor surat undangan dan notulen dikirim ke Surat Keluar SIPAS.'+chg:''));go('arsip')}}
function draft(){var raw=$('raw').value.trim();if(!raw)return toast('Tempel catatan rapat terlebih dahulu.');var P=[],K=[],T=[];
raw.split('\n').forEach(function(l){l=l.trim().replace(/\s+/g,' ');if(!l)return;var m=l.match(/^(keputusan|tindak lanjut)\s*:\s*(.*)$/i),f=function(x){x=x.charAt(0).toUpperCase()+x.slice(1);return/[.!?]$/.test(x)?x:x+'.'};
if(m&&/keputusan/i.test(m[1]))K.push(f(m[2]));else if(m){var q=m[2].split(/\s+-\s+/);T.push({act:f(q[1]||q[0]),pic:q[1]?q[0]:'[perlu dilengkapi]',due:q[2]&&/^\d{4}-\d\d-\d\d$/.test(q[2])?q[2]:''})}else P.push(f(l))});
var ag=$('agenda').value.split('\n').filter(Boolean);$('disc').value=(ag.length?'Agenda: '+ag.join('; ')+'\n':'')+P.map(function(x,i){return(i+1)+'. '+x}).join('\n');

T.forEach(function(t){$('tt').insertAdjacentHTML('beforeend',trow({act:t.act,pic:t.pic,due:t.due,st:'Belum dikerjakan',ev:''}))});toast('Draf disusun. Periksa dan lengkapi bagian bertanda [perlu dilengkapi] sebelum menyimpan.')}

function ap(id){var m=D.m.filter(function(x){return x.id==id})[0];m.status='Disetujui';m.upd=new Date().toISOString();m.hist.push(m.upd+' - disahkan oleh '+D.role);save();go('arsip')}
function del(id){if(confirm('Hapus notulen ini secara permanen?')){D.m=D.m.filter(function(x){return x.id!=id});save();go('arsip')}}

((m.att.length||md=='h')?'<div style="page-break-before:always"></div><!--HD-->'+kop()+'<h2>DAFTAR HADIR</h2><p style="text-align:center">'+esc(m.no)+' - '+fd(m.date)+'</p><table class="bt"><tr><th>No</th><th>Nama</th><th>NIP/NUPTK</th><th>Jabatan</th><th>Status</th><th>Tanda tangan</th></tr>'+(m.att.length?m.att:Array(25).fill({})).map(function(a,i){return'<tr><td>'+(i+1)+'</td><td>'+esc(a.n)+'</td><td>'+esc(a.nip)+'</td><td>'+esc(a.j)+'</td><td>'+esc(a.st)+'</td><td style="height:28px"></td></tr>'}).join('')+'</table>':'');
shw(md=='n'?h.split('<!--HD-->')[0].replace(/<div style="page-break-before:always"><\/div>$/,''):md=='h'?h.split('<!--HD-->')[1]:h.replace('<!--HD-->',''),'<details><summary>Riwayat perubahan</summary>'+m.hist.map(esc).join('<br>')+'</details>')}
